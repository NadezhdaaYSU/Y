[build-system]
# 77 reads `license` as an SPDX expression and `license-files` (PEP 639).
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

# `setup.py` puts the compiler library, `liby.so`, into the wheel and refuses
# a missing or stale one.

[project]
name = "y-lang"
dynamic = ["version"]
description = "Python bindings and PyTorch JIT compiler interop for the Y programming language"
readme = "README.md"
license = "BUSL-1.1"
# LICENSE and NOTICE link to the repository's own files, so the wheel carries
# the same text. THIRD_PARTY_NOTICES: the crates in liby.so and the probe.
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES"]
requires-python = ">=3.8"
dependencies = [
    "torch",
    # CPUInterpreter; loaded on first use, so `import y_lang` does not need it.
    "numpy",
]

[project.optional-dependencies]
# y_lang.exact: reproducible inference for Qwen2 models (Hugging Face models;
# tested with transformers 5.15, torch 2.13, and triton 3.7 on the GPU).
exact = [
    "transformers",
    "huggingface_hub",
]
dev = [
    "pytest",
    "cupy-cuda12x",
]

[tool.setuptools.dynamic]
version = {attr = "y_lang.__version__"}

[tool.setuptools.package-data]
# Compiled on first use by torch_interop's native launch path.
y_lang = ["_launch.c"]
# The exact_pv kernel's Y source; in the repository a link to tests/exact_pv.ysu.
"y_lang.exact" = ["exact_pv.ysu"]
